<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apartly PH — Reserve Your Stay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="supabase-config.js" defer></script>
  <script src="backend.js" defer></script>
</head>
<body>
  <!-- Standard Nav -->
  <header class="nav">
    <a class="brand" href="index.html" aria-label="Apartly PH Home">
      <div class="mark">A</div>
      <div class="word">Apartly<sup>PH</sup></div>
    </a>
    <div class="nav-right">
      <div class="nav-links">
        <a href="index.html">← Back to Listings</a>
        <a href="saved-apartments.html">Saved</a>
      </div>
      <div class="account-actions"></div>
    </div>
  </header>

  <div class="page-shell">
    <h1>Reserve Your Boarding Stay</h1>
    <p class="page-subtitle">Complete your tenant details to secure this room with the landlady.</p>

    <!-- Booking Summary Card -->
    <div class="form-card" id="bookingSummaryCard">
      <h2>Stay Summary</h2>
      <div id="summaryContent">
        <div class="summary-row">
          <span>Property</span>
          <strong id="summaryProperty">—</strong>
        </div>
        <div class="summary-row">
          <span>Check-in (Move-in)</span>
          <span id="summaryCheckin">—</span>
        </div>
        <div class="summary-row">
          <span>Check-out</span>
          <span id="summaryCheckout">—</span>
        </div>
        <div class="summary-row">
          <span>Duration</span>
          <span id="summaryNights">—</span>
        </div>
        <div class="summary-row">
          <span>Nightly rate</span>
          <span id="summaryRate">—</span>
        </div>
        <div class="summary-row">
          <span>Maintenance &amp; Admin fee</span>
          <span>₱100</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="summaryTotal">—</span>
        </div>
      </div>
    </div>

    <!-- Tenant Details Form -->
    <div class="form-card">
      <h2>Tenant Details</h2>
      <form id="checkoutForm">
        <div class="form-row">
          <div class="form-field">
            <label for="tenantName">Full Legal Name</label>
            <input type="text" id="tenantName" placeholder="Juan Dela Cruz" required>
          </div>
          <div class="form-field">
            <label for="tenantPhone">Mobile Number (Active PH SIM)</label>
            <input type="tel" id="tenantPhone" placeholder="+63 917 123 4567" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label for="tenantEmail">Email Address</label>
            <input type="email" id="tenantEmail" placeholder="juan@email.com" required>
          </div>
          <div class="form-field">
            <label for="tenantGender">Gender</label>
            <select id="tenantGender">
              <option value="Female">Female</option>
              <option value="Male">Male</option>
              <option value="Other">Prefer not to say</option>
            </select>
          </div>
        </div>
        <div class="form-row full">
          <div class="form-field">
            <label for="tenantNotes">Notes / Special Requests for the Landlady (optional)</label>
            <textarea id="tenantNotes" placeholder="E.g., Reviewee studying for November nursing boards; bringing 1 laptop and small electric kettle."></textarea>
          </div>
        </div>
      </form>
    </div>

    <!-- Payment Options Card -->
    <div class="form-card">
      <h2>Payment Option</h2>
      <div class="payment-options">
        <label class="payment-option">
          <input type="radio" name="paymentMethod" value="gcash" checked>
          <span>📱 GCash (Direct to Landlady / Escrow)</span>
        </label>
        <label class="payment-option">
          <input type="radio" name="paymentMethod" value="maya">
          <span>💳 Maya / Online Banking</span>
        </label>
        <label class="payment-option">
          <input type="radio" name="paymentMethod" value="cash">
          <span>💵 Cash on Check-in (Show Student/Gov ID)</span>
        </label>
      </div>
    </div>

    <!-- Submit Button -->
    <button class="btn-primary" id="confirmBookingBtn" type="button">
      Confirm Reservation
    </button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!window.Auth) return;
      await window.Auth.ready;

      const pending = JSON.parse(localStorage.getItem('pendingBooking'));
      if (!pending) {
        document.querySelector('.page-shell').innerHTML = `
          <div class="empty-state">
            <h3>No booking in progress</h3>
            <p>Please browse listings and choose a stay first.</p>
            <a href="index.html" class="btn-primary" style="width:auto;margin-top:14px;padding:10px 24px;">Browse Stays</a>
          </div>`;
        return;
      }

      // Fill summary
      const listings = window.Auth.getListings();
      const listing = listings.find(l => l.id === pending.listingId);
      const propName = listing ? listing.name : 'Boarding Stay';

      document.getElementById('summaryProperty').textContent = propName;
      document.getElementById('summaryCheckin').textContent = pending.checkIn;
      document.getElementById('summaryCheckout').textContent = pending.checkOut;
      document.getElementById('summaryNights').textContent = `${pending.nights} night${pending.nights > 1 ? 's' : ''}`;
      document.getElementById('summaryRate').textContent = `₱${pending.pricePerNight.toLocaleString()}`;
      document.getElementById('summaryTotal').textContent = `₱${pending.totalPrice.toLocaleString()}`;

      // Pre-fill user
      const user = window.Auth.getCurrentUser();
      if (user) {
        document.getElementById('tenantName').value = user.name || '';
        document.getElementById('tenantEmail').value = user.email || '';
        document.getElementById('tenantPhone').value = user.phone || '';
        if (user.gender) document.getElementById('tenantGender').value = user.gender;
      }

      // Confirm booking
      document.getElementById('confirmBookingBtn').addEventListener('click', () => {
        const name = document.getElementById('tenantName').value.trim();
        const email = document.getElementById('tenantEmail').value.trim();
        const phone = document.getElementById('tenantPhone').value.trim();

        if (!name || !email || !phone) {
          alert('Please enter your full name, email, and phone number.');
          return;
        }

        const bookingId = 'PH-BK' + Math.floor(1000 + Math.random() * 9000);
        const booking = {
          id: bookingId,
          listingId: pending.listingId,
          guestId: user ? user.id : 'guest-anon',
          propertyName: propName,
          guestName: name,
          guestEmail: email,
          guestPhone: phone,
          guestGender: document.getElementById('tenantGender').value,
          checkIn: pending.checkIn,
          checkOut: pending.checkOut,
          guests: pending.guests || 1,
          pricePerNight: pending.pricePerNight,
          nights: pending.nights,
          totalPrice: pending.totalPrice,
          status: 'Confirmed',
          dateBooked: new Date().toISOString().slice(0, 10),
          notes: document.getElementById('tenantNotes').value.trim(),
          paymentMethod: document.querySelector('input[name=paymentMethod]:checked').value
        };

        window.Auth.addBooking(booking);
        localStorage.removeItem('pendingBooking');
        window.location.href = `confirmation.html?bookingId=${bookingId}`;
      });
    });
  </script>
</body>
</html>
