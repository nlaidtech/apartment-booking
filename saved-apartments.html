<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apartly PH — Shortlisted Stays</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="supabase-config.js" defer></script>
  <script src="backend.js" defer></script>
</head>
<body>
  <!-- Standard Nav -->
  <header class="nav">
    <a class="brand" href="index.html" aria-label="Apartly PH Home">
      <div class="mark">A</div>
      <div class="word">Apartly<sup>PH</sup></div>
    </a>
    <div class="nav-right">
      <div class="nav-links">
        <a href="index.html">Browse Stays</a>
        <a href="saved-apartments.html" class="active">
          Saved
          <span class="saved-badge" data-saved-count>0</span>
        </a>
        <a href="profile.html?tab=inquiries">
          Inquiries
          <span class="badge-count unread-badge" id="inquiryUnreadBadge" style="display:none; margin-left:4px;">0</span>
        </a>
      </div>
      <div class="account-actions"></div>
    </div>
  </header>

  <div class="catalog-wrap" style="padding-top: 32px;">
    <div style="margin-bottom: 24px;">
      <h1 style="font-family: var(--font-serif); font-size: 26px; font-weight: 600; color: var(--teal-deep); margin: 0 0 6px;">Saved Stays</h1>
      <p id="savedSummaryTag" style="font-size: 14px; color: var(--muted); margin: 0;">Your shortlisted boarding houses</p>
    </div>

    <div class="listings-grid" id="savedGrid">
      <!-- Populated dynamically -->
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!window.Auth) return;
      await window.Auth.ready;

      const grid = document.getElementById('savedGrid');
      const summary = document.getElementById('savedSummaryTag');
      const savedCountEl = document.querySelector('[data-saved-count]');

      function render() {
        const savedIds = window.Auth.getSavedListings();
        const listings = window.Auth.getListings();
        const saved = listings.filter(l => savedIds.includes(l.id));

        if (savedCountEl) savedCountEl.textContent = saved.length;

        if (saved.length === 0) {
          grid.innerHTML = `
            <div class="empty-state">
              <h3>No saved stays yet</h3>
              <p>Browse our verified Philippine boarding houses and tap the heart icon to shortlist them here.</p>
              <a href="index.html" class="btn-primary" style="width:auto;display:inline-flex;padding:10px 24px;margin-top:16px;text-decoration:none;">Browse Stays</a>
            </div>`;
          summary.textContent = 'No stays shortlisted yet';
          return;
        }

        summary.textContent = `${saved.length} stay${saved.length > 1 ? 's' : ''} saved in your shortlist`;

        grid.innerHTML = saved.map(listing => `
          <article class="listing-card">
            <div class="listing-media">
              <img src="${listing.imageUrl}" alt="${listing.name}" class="listing-img" loading="lazy">
              <button type="button" class="listing-save-btn is-saved remove-save-btn" data-id="${listing.id}" aria-label="Remove from saved">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              </button>
            </div>
            <div class="listing-body">
              <div class="listing-header-row">
                <h3 class="listing-title">${listing.name}</h3>
                <span class="listing-rating">
                  <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                  ${listing.rating}
                </span>
              </div>
              <div class="listing-location-sub">📍 ${listing.location} &bull; ${listing.roomType}</div>
              <div class="listing-footer-row">
                <div class="listing-price-block">
                  <span class="listing-price-main">₱${listing.price}</span>
                  <span class="listing-price-sub">/ night</span>
                </div>
                <button type="button" class="listing-btn-book book-btn" data-id="${listing.id}">Book</button>
              </div>
            </div>
          </article>
        `).join('');

        // Remove handlers
        grid.querySelectorAll('.remove-save-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            window.Auth.toggleSaveListing(parseInt(btn.dataset.id, 10));
            render();
          });
        });

        // Book handlers
        grid.querySelectorAll('.book-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = parseInt(btn.dataset.id, 10);
            const listing = listings.find(l => l.id === id);
            if (!listing) return;
            const pendingBooking = {
              listingId: listing.id,
              checkIn: '15 Oct',
              checkOut: '18 Oct',
              checkInRaw: '2026-10-15',
              checkOutRaw: '2026-10-18',
              guests: 1,
              pricePerNight: listing.price,
              nights: 3,
              totalPrice: (listing.price * 3) + 100
            };
            localStorage.setItem('pendingBooking', JSON.stringify(pendingBooking));
            window.location.href = 'checkout.html';
          });
        });
      }

      render();
    });
  </script>
</body>
</html>
